# Light pull request checks. Owner decision of 18 Nov 2026 (docs/decisions.md): build, lint, typecheck and unit tests run on
# every pull request. The k6 performance suites run on demand and nightly (performance.yml). This replaces the
# 12 Nov 2026 manual-only Actions decision (RRDPLAT-44) for this light set only.
name: Pull request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@releaseready"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Guardrails
        run: npm run check:guardrails
      - name: Build and unit tests
        run: npm test
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks, trivy, semgrep and zizmor
        uses: releaseready/config/.github/actions/security-scan@6248d46f291d5a3eec87fdf07da5e8f2b1b5becb # v2.1.0
