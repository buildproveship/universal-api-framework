# Heavy suites. Owner decision of 18 Nov 2026 (docs/decisions.md): the k6 performance suites (npm run test:performance, which needs k6 on PATH) run on demand and nightly,
# not on every pull request (the light set is in pr.yml).
# Runs on GitHub-hosted ubuntu-24.04 (owner decision, 20 Nov 2026); k6 is the pinned official linux-amd64 release binary, checksum-verified.
name: Performance suites
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 02:00 Hong Kong time
permissions:
  contents: read
  packages: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@releaseready"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Official k6 release binary (https://github.com/grafana/k6/releases/tag/v0.54.0), version-pinned and verified against
      # its published SHA-256. The repository's Actions policy allows only GitHub-owned actions, so grafana/setup-k6-action is not usable.
      - name: Install k6 0.54.0 (official linux-amd64 binary)
        run: |
          set -euo pipefail
          K6_TGZ="k6-v0.54.0-linux-amd64.tar.gz"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$K6_TGZ" "https://github.com/grafana/k6/releases/download/v0.54.0/$K6_TGZ"
          echo "c7f03434854f837b6790ee81572e4b0f955241974c79a43cbb9f8d0fef069589  $RUNNER_TEMP/$K6_TGZ" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/k6-bin"
          tar -xzf "$RUNNER_TEMP/$K6_TGZ" --strip-components=1 -C "$RUNNER_TEMP/k6-bin" --wildcards "*/k6"
          echo "$RUNNER_TEMP/k6-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/k6-bin/k6" version
      - name: Performance suites
        run: npm run test:performance
